doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Stated here rather than left to the connection string. Doctrine needs the platform
        # to generate SQL, and without a version it will not even boot — which bites twice:
        # `cache:warmup` runs at image build time with no database to ask, and a connection
        # string pasted into a hosting form is easy to paste without the parameter. A
        # `serverVersion` in the URL still overrides this.
        #
        # The exact number matters less than having one: DBAL 4 keeps a single cutoff at 12,
        # so every server from 12 upwards gets the same platform and the same SQL. This says
        # what the project is developed and tested against; the managed database may be a
        # release or two ahead without any of it changing.
        server_version: '17'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
