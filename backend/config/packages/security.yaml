security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        # Exchanges e-mail + password for a short-lived access token.
        # `stateless: true` means no session is ever started for this request, which is
        # also why there is no CSRF token here: there is no cookie the browser would
        # attach automatically, so there is nothing for a cross-site form to ride on.
        login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\ApiAuthenticationFailureHandler

            # Password guessing is the one attack this endpoint exists to invite, and the
            # defence has to be here rather than in the controller: the authenticator runs
            # before any controller does.
            #
            # The limit is per IP *and* per username, which matters in both directions. Per
            # username alone lets a botnet spread its attempts across addresses; per IP alone
            # locks out an office behind one address the moment somebody there mistypes.
            #
            # Five in a minute is generous for a person and hopeless for a script. Failed
            # attempts count; a successful sign-in clears the record, so getting it right on
            # the sixth try is not punished afterwards.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        # Exchanges the httpOnly refresh cookie for a new access token.
        # Separate firewall because it authenticates with a different credential entirely.
        refresh:
            pattern: ^/api/v1/token/refresh$
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: gesdinet_jwt_refresh_token
                failure_handler: App\Security\ApiAuthenticationFailureHandler

        # Everything else: bearer token or nothing.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\ApiEntryPoint
            jwt: ~

    # Only the *first* matching rule is applied.
    access_control:
        - { path: ^/api/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/(login|register|demo)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hashing is expensive by design. In tests that cost buys nothing.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
