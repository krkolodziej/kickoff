<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kickoff</title>
    <meta name="description" content="Run an amateur football league: squads, fixtures, live matches and standings." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before the first paint, so a dark-mode user never sees a white flash while
      // React boots. The provider reads the same key and takes over from here.
      try {
        var stored = localStorage.getItem('kickoff.theme')
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
