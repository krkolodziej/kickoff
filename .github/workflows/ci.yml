name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API
    runs-on: ubuntu-latest

    services:
      # Deliberately the same engine and major version as local development, and as the
      # managed database in production. A CI database that is "close enough" hides exactly
      # the bugs CI is there to catch — as the move off MySQL demonstrated: a case-sensitive
      # LIKE and a partial unique index both broke tests that had been green for weeks.
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kickoff
          POSTGRES_DB: kickoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:kickoff@127.0.0.1:5432/kickoff?serverVersion=17&charset=utf8

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, intl, openssl, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - run: php bin/console lint:container
      - run: php bin/console lint:yaml config --parse-tags

      - name: Migrate and check the mapping matches the schema
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate

      - run: composer cs
      - run: composer stan
      - run: composer test

  # Render builds this exact Dockerfile on every deploy, so a Dockerfile that does not build
  # is a deployment that fails somewhere nobody is watching. Building it here moves that
  # failure into the pull request — and because the service deploys on `checksPass`, an image
  # that will not build can never ship.
  image:
    name: Production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kickoff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that will not start is no better than one that will not build. The container
      # is given no database on purpose: this asks only whether it can serve a request at all,
      # which is exactly what Render's health check asks a minute after every deploy.
      #
      # --cap-drop=ALL matters as much as the health check does. A runner hands a container the
      # default capability set and a hosting platform hands it less, so a binary carrying a file
      # capability the kernel cannot honour will not execve at all — a failure that reaches
      # production while every local `docker run` stays green. Dropping everything here is
      # stricter than the platform, so that failure lands in the pull request instead.
      - name: Start it and ask for the health check
        run: |
          docker run -d --name kickoff-ci -p 8080:8080 \
            --cap-drop=ALL \
            -e PORT=8080 \
            -e APP_SECRET=ci-only \
            -e 'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci?serverVersion=17&charset=utf8' \
            -e JWT_PASSPHRASE=ci-only \
            kickoff:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "the container never became healthy"
          docker logs kickoff-ci
          exit 1

      # The SPA has to be *inside* the image, not merely built beside it, and its own routes
      # have to reach it rather than 404. Both are easy to break in the Dockerfile and neither
      # shows up in any other job.
      - name: Check the SPA ships with it
        run: |
          curl -fsS http://127.0.0.1:8080/dashboard | grep -q 'id="root"'
          echo "the single-page application is served for its own routes"

      # A hub that is not there answers 404; a hub that is there and has not been given a
      # token answers 401. Telling those apart is the whole check: the first version of this
      # shipped a Caddy config that stopped the server from starting at all, and only the
      # health check above caught it — by accident, because nothing was listening.
      - name: Check the realtime hub is listening
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:8080/.well-known/mercure?topic=%2Fmatches%2F1')

          if [ "$status" != "401" ]; then
            echo "expected 401 from the hub, got $status"
            exit 1
          fi

          echo "the hub is up and refusing anonymous subscribers"

      - name: Container logs
        if: failure()
        run: docker logs kickoff-ci

      - name: Clean up
        if: always()
        run: docker rm -f kickoff-ci

  frontend:
    name: SPA
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm on PATH to work out where its store lives. With
      # no version given, the action reads it from the `packageManager` field, so the pin
      # lives in exactly one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          # One LTS behind the local runtime on purpose: it catches anything that quietly
          # depends on a very new Node.
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile is pnpm's `npm ci`: it refuses to run rather than quietly resolving
      # a dependency the lockfile does not describe.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec tsc -b
      - run: pnpm run test
      - run: pnpm run build
